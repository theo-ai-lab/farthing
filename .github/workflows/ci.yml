name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The invariant gate: money-critical core + adversarial golden set, with NO
  # third-party dependencies. If this is red, nothing else matters.
  invariant-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python }}
      - name: No floats in money core
        run: python scripts/check_no_float_money.py
      - name: Core + property fuzz + adversarial golden set
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -p 'test_*.py' -v

  # Full build: adapters compile, lint, and strict type-check.
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Type-check (strict core)
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q
