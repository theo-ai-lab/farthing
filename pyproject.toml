[project]
name = "farthing"
version = "0.1.0"
description = "The support agent that is allowed to touch money: policy-gated, human-approved, exactly-once refunds against Stripe."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Theo Bermudez" }]
keywords = ["ai-automation", "agents", "temporal", "stripe", "human-in-the-loop", "workflow"]

# The money-critical core (farthing.money/domain/policy/ledger/idempotency/
# execution_guard) imports NOTHING here — it is pure standard library and is
# tested with zero dependencies. These are the edge adapters only.
# Money-path adapters carry upper caps so a breaking major cannot be pulled in
# silently. The committed uv.lock (run `uv lock`) is the primary reproducibility
# guarantee; these caps are the belt-and-suspenders for the fast-moving deps.
dependencies = [
  "pydantic-ai-slim[anthropic,temporal]>=2.9.0,<3",
  "anthropic>=0.116.0,<1",
  "temporalio>=1.30.0,<2",
  "stripe>=15.3.0,<16",
  "fastapi>=0.121.0,<1",
  "uvicorn[standard]>=0.38.0,<1",
  "psycopg[binary]>=3.2.0,<4",
  "pydantic>=2.12.0,<3",
  "pydantic-settings>=2.7.0,<3",
  "opentelemetry-sdk>=1.43.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.43.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.0",
  "ruff>=0.15.0",
  "pyright>=1.1.411",
]

[project.scripts]
farthing-worker = "farthing.worker:main"
farthing-inbox = "farthing.approval.app:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# `flt-money` is a local custom rule enforced in CI (see scripts/check_no_float_money.py);
# ruff carries the general hygiene set.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src/farthing"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
